<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="64" viewBox="0 0 1200 64" font-family="Georgia,'Iowan Old Style','Palatino Linotype',serif">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f8f0de"/><stop offset=".5" stop-color="#f3e7cd"/><stop offset="1" stop-color="#f8f0de"/></linearGradient>
    <mask id="notch"><rect width="1200" height="64" fill="#fff"/><circle cx="0" cy="32" r="14" fill="#000"/><circle cx="1200" cy="32" r="14" fill="#000"/></mask>
  </defs>
  <style>
    .mono{font-family:'Courier New',Courier,monospace}
    .perf{stroke-dasharray:2 9;animation:perf 3s linear infinite}
    @keyframes perf{to{stroke-dashoffset:-22}}
    .spin{animation:spin 40s linear infinite;transform-box:fill-box;transform-origin:center}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
  <g mask="url(#notch)">
    <rect width="1200" height="64" rx="8" fill="url(#paper)"/>
    <line class="perf" x1="20" y1="32" x2="548" y2="32" stroke="#b89a63" stroke-width="3" stroke-linecap="round"/>
    <line class="perf" x1="652" y1="32" x2="1180" y2="32" stroke="#b89a63" stroke-width="3" stroke-linecap="round"/>
    <text x="120" y="22" font-size="9" letter-spacing="3" class="mono" fill="#b89a63">TEAR HERE</text>
    <text x="1080" y="52" font-size="9" letter-spacing="3" text-anchor="end" class="mono" fill="#b89a63">NEXT STOP</text>
    <g transform="translate(600 32)">
      <g class="spin" fill="none" stroke="#7a1f2b" stroke-width="1.4">
        <circle r="24" stroke-dasharray="3 3"/>
        <path d="M0 -18 L4 -4 L18 0 L4 4 L0 18 L-4 4 L-18 0 L-4 -4 Z" fill="#c99a2e" fill-opacity=".85" stroke="#7a1f2b"/>
      </g>
      <circle r="4" fill="#7a1f2b"/>
    </g>
  </g>
</svg>
