<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" font-family="Georgia,'Iowan Old Style','Palatino Linotype',serif">
  <defs>
    <radialGradient id="leather" cx="35%" cy="40%" r="90%"><stop offset="0" stop-color="#8a2533"/><stop offset=".6" stop-color="#6a1824"/><stop offset="1" stop-color="#450f18"/></radialGradient>
    <pattern id="pebble" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#000" opacity=".12"/><circle cx="6.5" cy="6" r=".9" fill="#fff" opacity=".04"/></pattern>
    <linearGradient id="foil" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#b8892a"/><stop offset=".42" stop-color="#e2bf62"/><stop offset=".5" stop-color="#fff1c4"/><stop offset=".58" stop-color="#e2bf62"/><stop offset="1" stop-color="#b8892a"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;1 0" keyTimes="0;.5;1" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <path id="crestRing" d="M -52 0 A 52 52 0 1 1 52 0 A 52 52 0 1 1 -52 0"/>
    <clipPath id="frame"><rect width="1200" height="300" rx="20"/></clipPath>
  </defs>
  <style>
    .mono{font-family:'Courier New',Courier,monospace}
    .spin{animation:spin 60s linear infinite;transform-origin:0 0}
    @keyframes spin{to{transform:rotate(360deg)}}
    .rise{animation:rise 12s ease-out infinite both}
    @keyframes rise{0%{opacity:0;transform:translateY(8px)}6%,94%{opacity:1;transform:translateY(0)}100%{opacity:0}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
  <g clip-path="url(#frame)">
    <rect width="1200" height="300" fill="url(#leather)"/>
    <rect width="1200" height="300" fill="url(#pebble)"/>
    <rect x="16" y="16" width="1168" height="268" rx="12" fill="none" stroke="#e2bf62" stroke-opacity=".55" stroke-width="1.4"/>
    <rect x="24" y="24" width="1152" height="252" rx="8" fill="none" stroke="#e2bf62" stroke-opacity=".3" stroke-width="1" stroke-dasharray="5 5"/>

    <!-- crest -->
    <g transform="translate(170 150)">
      <circle r="76" fill="none" stroke="url(#foil)" stroke-width="2.4"/>
      <g class="spin"><circle r="66" fill="none" stroke="#e2bf62" stroke-opacity=".6" stroke-width="1" stroke-dasharray="2 5"/>
        <text font-size="10.5" letter-spacing="2.2" class="mono" font-weight="700" fill="#e2bf62"><textPath href="#crestRing">CONFERENCE PASSPORT · IPELRA 2026 · </textPath></text></g>
      <path d="M0 -36 L8 -8 L36 0 L8 8 L0 36 L-8 8 L-36 0 L-8 -8 Z" fill="url(#foil)"/>
      <path d="M0 -20 L4 -4 L20 0 L4 4 L0 20 L-4 4 L-20 0 L-4 -4 Z" fill="#6a1824" transform="rotate(45)"/>
      <circle r="5" fill="#fff1c4"/>
    </g>

    <text x="320" y="78" font-size="34" font-style="italic" fill="url(#foil)">Every stamp counts.</text>
    <text x="322" y="102" font-size="11" letter-spacing="3" class="mono" fill="#e9c9a8">FOUR THINGS I WOULD TELL MYSELF IN APRIL</text>

    <g class="rise" style="animation-delay:.2s">
      <text x="322" y="150" font-size="13" class="mono" font-weight="700" fill="#e2bf62">01</text>
      <text x="356" y="150" font-size="18" fill="#fbefd9">Email is infrastructure.</text>
      <text x="356" y="172" font-size="13.5" fill="#e0b9a0">Load-test it the way you would an API.</text>
    </g>
    <g class="rise" style="animation-delay:.6s">
      <text x="760" y="150" font-size="13" class="mono" font-weight="700" fill="#e2bf62">02</text>
      <text x="794" y="150" font-size="18" fill="#fbefd9">Robots open your links first.</text>
      <text x="794" y="172" font-size="13.5" fill="#e0b9a0">Let one login link survive a few opens.</text>
    </g>
    <g class="rise" style="animation-delay:1s">
      <text x="322" y="222" font-size="13" class="mono" font-weight="700" fill="#e2bf62">03</text>
      <text x="356" y="222" font-size="18" fill="#fbefd9">Forgive spelling. Never numbers.</text>
      <text x="356" y="244" font-size="13.5" fill="#e0b9a0">“403 b” is 403b. “401k” is not.</text>
    </g>
    <g class="rise" style="animation-delay:1.4s">
      <text x="760" y="222" font-size="13" class="mono" font-weight="700" fill="#e2bf62">04</text>
      <text x="794" y="222" font-size="18" fill="#fbefd9">Freeze deploys when doors open.</text>
      <text x="794" y="244" font-size="13.5" fill="#e0b9a0">A fresh deploy is a cold start under load.</text>
    </g>
  </g>
  <rect x="1" y="1" width="1198" height="298" rx="19" fill="none" stroke="#450f18" stroke-width="2"/>
</svg>
