<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" font-family="Georgia,'Iowan Old Style','Palatino Linotype',serif">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fcf7ec"/><stop offset="1" stop-color="#f3e7cd"/></linearGradient>
    <pattern id="grain" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#a88a55" opacity=".14"/></pattern>
    <mask id="ticket">
      <rect x="40" y="30" width="1120" height="480" rx="18" fill="#fff"/>
      <circle cx="900" cy="30" r="14" fill="#000"/><circle cx="900" cy="510" r="14" fill="#000"/>
    </mask>
    <clipPath id="card"><rect x="40" y="30" width="1120" height="480" rx="18"/></clipPath>
    <filter id="lift" x="-5%" y="-5%" width="110%" height="115%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#5a4327" flood-opacity=".2"/></filter>
  </defs>
  <style>
    .mono{font-family:'Courier New',Courier,monospace}
    .lbl{font-size:9.5px;letter-spacing:2.5px;fill:#9a8768;font-weight:700}
    .stop-t{font-size:17px;font-weight:700;fill:#2b2118}
    .stop-s{font-size:11px;fill:#6b5a45}
    .seg{font-size:10.5px;fill:#9a8768}
    .pulse{animation:pulse 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes pulse{0%{transform:scale(.6);opacity:.8}100%{transform:scale(2.2);opacity:0}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>

  <g filter="url(#lift)">
    <g mask="url(#ticket)">
      <rect x="40" y="30" width="1120" height="480" fill="url(#paper)"/>
      <rect x="40" y="30" width="1120" height="480" fill="url(#grain)"/>
      <rect x="40" y="30" width="1120" height="66" fill="#7a1f2b"/>
      <rect x="40" y="96" width="1120" height="4" fill="#c99a2e"/>
    </g>
  </g>

  <!-- header -->
  <text x="72" y="72" font-size="27" font-style="italic" fill="#fbefd9">Itinerary</text>
  <text x="200" y="70" font-size="11" letter-spacing="3" class="mono" fill="#e9c9a8">ONE CHECK-IN, END TO END</text>
  <text x="930" y="70" font-size="11" letter-spacing="3" class="mono" font-weight="700" fill="#e2bf62">BOARDING PASS</text>

  <!-- fields -->
  <g class="mono"><text x="72" y="128" class="lbl">FLIGHT</text><text x="270" y="128" class="lbl">CLASS</text><text x="470" y="128" class="lbl">GATE</text><text x="670" y="128" class="lbl">BOARDING</text></g>
  <text x="72" y="150" font-size="18" fill="#2b2118">PSP-2026</text>
  <text x="270" y="150" font-size="18" fill="#2b2118">Serverless</text>
  <text x="470" y="150" font-size="18" fill="#2b2118">Free tier</text>
  <text x="670" y="150" font-size="18" fill="#2b2118">Mon, Oct 5</text>

  <!-- main line -->
  <path id="main" d="M120 250 H800" stroke="#7a1f2b" stroke-width="8" stroke-linecap="round" fill="none"/>
  <!-- branch -->
  <path id="right" d="M560 250 V320 C560 380, 600 420, 660 420 H800" stroke="#c99a2e" stroke-width="8" stroke-linecap="round" fill="none"/>
  <path d="M560 320 C560 380, 520 420, 460 420 H300" stroke="#c99a2e" stroke-width="8" stroke-linecap="round" fill="none"/>

  <!-- travelling check-in -->
  <circle r="7" fill="#fcf7ec" stroke="#2b2118" stroke-width="2.5">
    <animateMotion dur="6s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;.7;1" calcMode="linear" path="M120 250 H800"/>
  </circle>
  <circle r="6" fill="#fcf7ec" stroke="#7a1f2b" stroke-width="2.5">
    <animateMotion dur="6s" begin="2.4s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;.6;1" calcMode="linear" path="M560 250 V320 C560 380, 600 420, 660 420 H800"/>
  </circle>

  <!-- stops: main -->
  <g fill="#fcf7ec" stroke-width="5">
    <circle cx="120" cy="250" r="15" stroke="#7a1f2b"/>
    <circle cx="330" cy="250" r="15" stroke="#7a1f2b"/>
    <circle cx="560" cy="250" r="19" stroke="#2b2118"/>
    <circle cx="800" cy="250" r="15" stroke="#7a1f2b"/>
    <circle cx="300" cy="420" r="15" stroke="#c99a2e"/>
    <circle cx="800" cy="420" r="15" stroke="#c99a2e"/>
  </g>
  <circle cx="560" cy="250" r="9" fill="#2b2118"/>
  <circle class="pulse" cx="560" cy="250" r="19" fill="none" stroke="#2b2118" stroke-width="2"/>

  <g text-anchor="middle">
    <text x="120" y="204" class="stop-t">Attendee phone</text><text x="120" y="222" class="stop-s mono">React 18 + Vite SPA</text>
    <text x="330" y="204" class="stop-t">Static Web App</text><text x="330" y="222" class="stop-s mono">Free tier · CDN</text>
    <text x="560" y="200" class="stop-t">Azure Functions</text><text x="560" y="218" class="stop-s mono">Node 22 · Consumption</text>
    <text x="800" y="204" class="stop-t">Cosmos DB</text><text x="800" y="222" class="stop-s mono">serverless · 3 containers</text>

    <text x="225" y="282" class="seg mono">static files</text>
    <text x="445" y="282" class="seg mono">/api + JWT</text>
    <text x="680" y="282" class="seg mono">ETag If-Match</text>

    <text x="300" y="456" class="stop-t">Application Insights</text><text x="300" y="474" class="stop-s mono">traces · live metrics</text>
    <text x="800" y="456" class="stop-t">Microsoft Graph mail</text><text x="800" y="474" class="stop-s mono">6 mailboxes · round-robin</text>
    <text x="800" y="491" class="stop-s mono" fill="#9a8768">ACS only if all six fail</text>
  </g>
  <text x="578" y="336" class="seg mono">warmup timer · every 10 min · Oct 5–10</text>

  <!-- perforation -->
  <line x1="900" y1="100" x2="900" y2="496" stroke="#b89a63" stroke-width="2.5" stroke-dasharray="2 8" stroke-linecap="round"/>

  <!-- stub -->
  <g class="mono"><text x="930" y="134" class="lbl">PASSENGERS</text><text x="930" y="196" class="lbl">FROM</text><text x="930" y="254" class="lbl">TO</text><text x="930" y="312" class="lbl">FARE · ESTIMATED</text></g>
  <text x="930" y="166" font-size="28" fill="#2b2118" font-weight="700">200</text>
  <text x="996" y="166" font-size="13" fill="#6b5a45">attendees</text>
  <text x="930" y="222" font-size="18" fill="#2b2118">Sponsor table</text>
  <text x="930" y="280" font-size="18" fill="#2b2118">Prize drawing</text>
  <text x="930" y="352" font-size="40" font-style="italic" fill="#7a1f2b">≈ $2</text>
  <text x="930" y="374" font-size="10.5" class="mono" fill="#6b5a45">April → Oct 10, all-in</text>
  <line x1="930" y1="432" x2="1130" y2="432" stroke="#2b2118" stroke-width="54" stroke-dasharray="2 3 1 2 4 2 1 3 2 2 3 1 1 2 4 3 2 1 1 2 3 2 2 4 1 1 3 2 2 3 1 2 4 1 2 2 1 3"/>
  <text x="930" y="478" font-size="9.5" letter-spacing="1.5" class="mono" fill="#9a8768">IPELRA · OCT 5–10 · GALENA, IL</text>
</svg>
